<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sigeon OS Music: a music player for ConMon Lab that keeps your songs in the browser and streams YouTube.">
<meta name="theme-color" content="#120a0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sigeon Music">
<title>Sigeon OS Music</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: three-pane music shell (sidebar, scrolling library, docked player bar) that folds into tabs + mini-player on phones */
:root {
  --bg: #120a0f;
  --panel: #1b1117;
  --raise: #271820;
  --hover: #32202a;
  --line: #3d2733;
  --fg: #f8ebf1;
  --muted: #bb9dad;
  --accent: #f0629b;
  --accent-deep: #a8205a;
  --on-accent: #1d0611;
  --danger: #ff8f9c;
  --scrim: rgba(10, 4, 8, .62);
  --shadow: 0 14px 44px rgba(0, 0, 0, .5);
  --display: "Nunito", "Varela Round", ui-rounded, system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h: 84px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6eef2; --panel: #ffffff; --raise: #f4e8ee; --hover: #ecdce4; --line: #e3cfd9;
    --fg: #2a141f; --muted: #7d5d6d; --accent: #cc2f6d; --accent-deep: #9c1b50; --on-accent: #ffffff;
    --danger: #c0263d; --scrim: rgba(60, 20, 40, .35); --shadow: 0 14px 40px rgba(90, 30, 60, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6eef2; --panel: #ffffff; --raise: #f4e8ee; --hover: #ecdce4; --line: #e3cfd9;
  --fg: #2a141f; --muted: #7d5d6d; --accent: #cc2f6d; --accent-deep: #9c1b50; --on-accent: #ffffff;
  --danger: #c0263d; --scrim: rgba(60, 20, 40, .35); --shadow: 0 14px 40px rgba(90, 30, 60, .18);
  color-scheme: light;
}

html { box-sizing: border-box; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.i { width: 22px; height: 22px; fill: currentColor; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
#app {
  height: 100%; display: grid; gap: 8px;
  grid-template-columns: clamp(232px, 21vw, 300px) minmax(0, 1fr) auto;
  grid-template-rows: minmax(0, 1fr) var(--bar-h);
  padding-top: 8px; padding-bottom: 0;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.side { grid-row: 1; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
.box { background: var(--panel); border-radius: 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.brand img { width: 46px; height: auto; filter: drop-shadow(0 4px 10px rgba(240, 98, 155, .25)); }
.brand .wm { display: grid; line-height: 1; }
.brand .wm b { font: 900 22px/1 var(--display); letter-spacing: -.3px; display: flex; align-items: center; gap: 6px; }
.brand .wm b span { font: 800 12px/1 var(--display); background: var(--accent-deep); color: #fff; padding: 3px 6px 4px; border-radius: 6px; letter-spacing: .5px; }
.brand .wm small { font: 800 13px/1 var(--display); color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
.nav { display: grid; padding: 6px 8px 10px; }
.nav a { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 8px; color: var(--muted); font-weight: 700; transition: color .15s; }
.nav a:hover { color: var(--fg); }
.nav a.on { color: var(--fg); }
.nav a.on .i { color: var(--accent); }
.lib { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.lib-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 8px 20px; color: var(--muted); font-weight: 700; }
.lib-head .btn-icon { width: 32px; height: 32px; }
.lib-list { overflow-y: auto; padding: 0 8px 10px; }
.lib-item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.lib-item:hover { background: var(--hover); }
.lib-item.on { background: var(--raise); }
.lib-item .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-item.on .t { color: var(--accent); }
.lib-item .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb { width: 44px; height: 44px; border-radius: 6px; overflow: hidden; background: var(--raise); display: grid; place-items: center; }
.thumb img, .art img, .card .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.liked-art { background: linear-gradient(135deg, var(--accent-deep), var(--accent) 60%, #ffc2d9); color: #fff; display: grid; place-items: center; }
.liked-art .i { width: 46%; height: 46%; }
.store { padding: 12px 16px 14px; font-size: 12px; color: var(--muted); display: grid; gap: 6px; }
.store .meter { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.store .meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .4s; }
.store .tag { font-family: var(--display); font-weight: 800; color: var(--fg); opacity: .8; }

main { grid-row: 1; position: relative; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; border-radius: 12px; background: var(--panel); scroll-behavior: smooth; }
main::before { content: ""; position: absolute; inset: 0 0 auto; height: 340px; background: linear-gradient(var(--tint, rgba(240, 98, 155, .22)), transparent); pointer-events: none; transition: background .5s; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 64px; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; transition: background .2s; }
.topbar.solid { background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); box-shadow: 0 1px 0 var(--line); }
.topbar .circ { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; color: var(--fg); }
.topbar .circ:disabled { opacity: .4; cursor: default; }
.topbar .ttl { font: 800 18px var(--display); margin-left: 6px; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar.solid .ttl { opacity: 1; }
.topbar .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 700; font-size: 14px; background: var(--fg); color: var(--bg); white-space: nowrap; }
.pill.ghost { background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--fg); }
.pill .i { width: 18px; height: 18px; }
.btn-icon { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); transition: color .15s, background .15s; }
.btn-icon:hover { color: var(--fg); background: var(--hover); }
.btn-icon.on { color: var(--accent); }

.view { position: relative; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; padding-block: 4px 40px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
.greet { font: 900 clamp(26px, 3.4vw, 34px)/1.1 var(--display); letter-spacing: -.5px; }
.sec { display: grid; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-head h2 { font-size: 22px; font-weight: 900; letter-spacing: -.2px; }
.sec-head a, .sec-head button { font-size: 13px; font-weight: 700; color: var(--muted); }
.sec-head a:hover, .sec-head button:hover { color: var(--fg); text-decoration: underline; }
.sub { color: var(--muted); font-size: 14px; }

/* quick tiles */
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; }
.qt { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding-right: 10px; height: 56px; border-radius: 6px; overflow: hidden; background: color-mix(in srgb, var(--fg) 8%, transparent); font-weight: 700; transition: background .15s; }
.qt:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
.qt .thumb { width: 56px; height: 56px; border-radius: 0; }
.qt .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qt .playfab { width: 36px; height: 36px; opacity: 0; transform: none; position: relative; right: auto; bottom: auto; }
.stretch::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.playfab { z-index: 2; }
.qt:hover .playfab, .qt:focus-within .playfab { opacity: 1; }

/* shelves of cards */
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(148px, 176px); gap: 12px; overflow-x: auto; overscroll-behavior-x: contain; margin-inline: -8px; padding: 2px 8px 8px; scrollbar-width: thin; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card { position: relative; display: grid; gap: 8px; align-content: start; padding: 10px; border-radius: 10px; transition: background .2s; min-width: 0; }
.card:hover { background: var(--raise); }
.card .art { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--raise); box-shadow: 0 8px 22px rgba(0, 0, 0, .28); }
.card.round .art { border-radius: 50%; }
.card .t { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .s { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.playfab { position: absolute; right: 8px; bottom: 8px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 18px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s, scale .1s; }
.playfab:hover { scale: 1.06; }
.card:hover .playfab, .card:focus-within .playfab { opacity: 1; transform: none; }
.playfab .i { width: 24px; height: 24px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 10px/1 var(--mono); letter-spacing: .6px; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); vertical-align: 2px; }
.chip.yt { background: color-mix(in srgb, var(--fg) 12%, transparent); color: var(--muted); }

/* collection header */
.hero { display: grid; grid-template-columns: clamp(140px, 22vw, 232px) minmax(0, 1fr); gap: 24px; align-items: end; padding-top: 8px; }
.hero .art { aspect-ratio: 1; max-width: 100%; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); background: var(--raise); }
.hero.round .art { border-radius: 50%; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; aspect-ratio: 1; }
.hero .kind { font-size: 13px; font-weight: 700; }
.hero h1 { font: 900 clamp(32px, 6vw, 76px)/1 var(--display); letter-spacing: -1.5px; margin: 6px 0 12px; overflow-wrap: anywhere; }
.hero .meta { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.hero .meta b { color: var(--fg); }
.hero .desc { color: var(--muted); margin: 0 0 8px; max-width: 62ch; }
.actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bigplay { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent); transition: scale .1s; }
.bigplay:hover { scale: 1.05; }
.bigplay .i { width: 28px; height: 28px; }
.actions .btn-icon { width: 44px; height: 44px; }
.actions .btn-icon .i { width: 28px; height: 28px; }

/* track list */
.tracks { display: grid; min-width: 0; }
.trow { display: grid; grid-template-columns: 36px minmax(0, 4fr) minmax(0, 3fr) 34px 56px 34px; gap: 12px; align-items: center; padding: 6px 12px; border-radius: 6px; min-height: 56px; cursor: default; }
.tracks.noalbum .trow { grid-template-columns: 36px minmax(0, 1fr) 34px 56px 34px; }
.trow.hd { min-height: 36px; color: var(--muted); font-size: 12px; letter-spacing: .6px; text-transform: uppercase; border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 8px; }
.trow:not(.hd):hover, .trow:focus-within { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.trow.sel { background: color-mix(in srgb, var(--fg) 12%, transparent); }
.trow .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; position: relative; height: 22px; display: grid; justify-items: end; align-items: center; }
.trow .n .i { display: none; color: var(--fg); width: 18px; height: 18px; }
.trow:not(.hd):hover .n span { display: none; }
.trow:not(.hd):hover .n .i.pl { display: block; }
.trow .main { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; min-width: 0; }
.trow .main .thumb { width: 40px; height: 40px; border-radius: 4px; }
.trow .ti { min-width: 0; }
.trow .ti .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.trow .ti .a { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.trow .ti .a a:hover, .trow .al a:hover { color: var(--fg); text-decoration: underline; }
.trow .al { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .d { color: var(--muted); font-size: 13px; text-align: right; }
.trow .lk, .trow .mo { opacity: 0; width: 32px; height: 32px; }
.trow .lk.on { opacity: 1; color: var(--accent); }
.trow:hover .lk, .trow:hover .mo, .trow:focus-within .lk, .trow:focus-within .mo { opacity: 1; }
.trow .lk .i, .trow .mo .i { width: 18px; height: 18px; }
.trow.now .ti .t { color: var(--accent); }
.trow.now .n span { display: none; }
.trow.now .n .eq { display: flex; }
.trow.now:hover .n .eq { display: none; }
.eq { display: none; gap: 2px; align-items: end; height: 14px; }
.eq i { width: 3px; background: var(--accent); border-radius: 1px; height: 30%; }
.playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.6s; } .eq i:nth-child(4) { animation-delay: -.15s; }
@keyframes eq { from { height: 20%; } to { height: 100%; } }
.add-btn { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--muted); font-size: 13px; font-weight: 700; color: var(--fg); }
.add-btn:hover { border-color: var(--fg); scale: 1.03; }

/* empty and notes */
.empty { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 40px 16px; border: 1px dashed var(--line); border-radius: 14px; }
.empty .i { width: 44px; height: 44px; color: var(--accent); }
.empty h3 { font-size: 22px; font-weight: 900; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 16px; border-radius: 10px; background: var(--raise); color: var(--muted); font-size: 14px; }
.note b { color: var(--fg); }
.note .i { color: var(--accent); }
.note p { margin: 0; }
.note button { color: var(--accent); font-weight: 700; text-decoration: underline; }
.loading { color: var(--muted); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* search */
.searchbox { display: flex; align-items: center; gap: 10px; height: 48px; width: min(100%, 460px); padding: 0 16px; border-radius: 999px; background: var(--raise); border: 1px solid transparent; }
.searchbox:focus-within { border-color: var(--fg); }
.searchbox input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 16px; }
.searchbox .i { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { height: 32px; padding: 0 14px; border-radius: 999px; background: color-mix(in srgb, var(--fg) 9%, transparent); font-size: 14px; font-weight: 500; }
.fchip:hover { background: color-mix(in srgb, var(--fg) 15%, transparent); }
.fchip.on { background: var(--fg); color: var(--bg); }
.lib-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.lib-tools select { height: 34px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); padding: 0 10px; }

/* ---------- player bar ---------- */
.bar { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 1fr); align-items: center; gap: 16px; padding: 0 8px; }
.np-mini { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: center; min-width: 0; }
.np-mini .thumb { width: 56px; height: 56px; cursor: pointer; }
.np-mini .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.np-mini .t a:hover, .np-mini .a a:hover { text-decoration: underline; }
.np-mini .a { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctrl { display: grid; gap: 4px; justify-items: center; min-width: 0; }
.ctrl .row { display: flex; gap: 14px; align-items: center; }
.pp { width: 38px; height: 38px; border-radius: 50%; background: var(--fg); color: var(--bg); display: grid; place-items: center; transition: scale .1s; }
.pp:hover { scale: 1.06; }
.btn-icon.dot { position: relative; }
.btn-icon.dot.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.seek { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; width: 100%; max-width: 620px; font-size: 12px; color: var(--muted); }
.seek span:first-child { text-align: right; }
.right { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.right .vol { width: min(110px, 9vw); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; cursor: pointer; --p: 0%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--fg) var(--p), var(--line) var(--p)); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--fg) var(--p), var(--line) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--fg); opacity: 0; transition: opacity .15s; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--fg); opacity: 0; }
input[type=range]:hover::-webkit-slider-runnable-track, input[type=range]:focus-visible::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
input[type=range]:hover::-moz-range-track { background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { opacity: 1; }
input[type=range]:hover::-moz-range-thumb { opacity: 1; }
.bar.idle .ctrl, .bar.idle .right { opacity: .45; pointer-events: none; }
.tabs { display: none; }
.mini-progress { display: none; }

/* queue panel (desktop) */
#queuePanel { grid-row: 1; width: clamp(280px, 24vw, 340px); min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.qhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 6px 18px; }
.qhead h2 { font-size: 17px; font-weight: 900; }
.qbody { overflow-y: auto; padding: 4px 8px 16px; display: grid; gap: 4px; align-content: start; }
.qbody h3 { font: 700 14px var(--body); color: var(--fg); padding: 12px 8px 4px; }
.qbody h3 small { color: var(--muted); font-weight: 400; }
.qrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.qrow:hover { background: var(--hover); }
.qrow .t { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow .a { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow.cur .t { color: var(--accent); }
.qrow .btn-icon { width: 30px; height: 30px; opacity: 0; }
.qrow:hover .btn-icon { opacity: 1; }
.qrow .btn-icon .i { width: 18px; height: 18px; }

/* ---------- now playing overlay ---------- */
#np { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto minmax(0, 1fr); background: radial-gradient(120% 80% at 50% 0%, var(--npc, #6b2445) 0%, var(--bg) 72%); color: var(--fg);
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: up .28s cubic-bezier(.2, .8, .2, 1); }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.np-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; }
.np-top .ctx { text-align: center; min-width: 0; }
.np-top .ctx small { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.np-top .ctx b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-body { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: 18px; min-height: 0; overflow-y: auto; }
.np-wrap { width: min(100%, 460px); display: grid; gap: 16px; }
#npArt { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; max-height: 46vh; justify-self: center; border-radius: 10px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); background: var(--raise); }
#npArt.vid { aspect-ratio: 16 / 9; background: #000; }
#npArt img { width: 100%; height: 100%; object-fit: cover; display: block; }
#viz { width: 100%; height: 56px; display: block; }
.np-ti { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.np-ti h2 { font-size: clamp(22px, 4vw, 28px); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-ti p { margin: 2px 0 0; color: var(--muted); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-ti .btn-icon .i { width: 28px; height: 28px; }
.np-seek { display: grid; gap: 2px; }
.np-seek .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.np-ctrl { display: flex; align-items: center; justify-content: space-between; }
.np-ctrl .pp { width: 64px; height: 64px; }
.np-ctrl .pp .i { width: 32px; height: 32px; }
.np-ctrl .btn-icon { width: 48px; height: 48px; color: var(--fg); }
.np-ctrl .btn-icon .i { width: 30px; height: 30px; }
.np-ctrl .btn-icon.dim { color: var(--muted); }
.np-ctrl .btn-icon.dim.on { color: var(--accent); }
.np-foot { display: flex; justify-content: space-between; align-items: center; }
#npQueue { width: min(100%, 460px); background: color-mix(in srgb, var(--panel) 80%, transparent); border-radius: 12px; }
#npQueue .qbody { max-height: none; }

/* ---------- YouTube dock ---------- */
#ytDock { position: fixed; z-index: 45; width: 356px; height: 200px; right: 20px; bottom: 100px; border-radius: 10px; overflow: hidden; background: #000; box-shadow: var(--shadow); }
#ytDock .x { position: absolute; top: 6px; right: 6px; z-index: 2; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; }
#ytDock .x .i { width: 18px; height: 18px; }
#ytHost, #ytHost iframe { width: 100%; height: 100%; border: 0; display: block; }

/* ---------- menus, modals, toasts ---------- */
#menu { position: fixed; z-index: 60; min-width: 230px; max-width: min(320px, calc(100vw - 24px)); max-height: 70vh; overflow-y: auto; padding: 4px; border-radius: 8px; background: var(--raise); box-shadow: var(--shadow); border: 1px solid var(--line); }
#menu .mh { padding: 10px 12px 8px; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
#menu .mh .thumb { width: 40px; height: 40px; }
#menu .mh b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
#menu .mh small { color: var(--muted); }
#menu button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 4px; text-align: left; font-size: 14px; }
#menu button:hover, #menu button:focus-visible { background: var(--hover); }
#menu button .i { width: 18px; height: 18px; color: var(--muted); }
#menu button.danger { color: var(--danger); }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
#scrim { position: fixed; inset: 0; z-index: 55; background: transparent; }
#scrim.dark { background: var(--scrim); z-index: 70; }
#modal { position: fixed; z-index: 75; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow-y: auto; padding: 22px; border-radius: 14px; background: var(--raise); box-shadow: var(--shadow); display: grid; gap: 16px; }
#modal h2 { font-size: 22px; font-weight: 900; }
#modal p { margin: 0; color: var(--muted); }
#modal label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
#modal input[type=text], #modal input[type=password], #modal input[type=number] { height: 42px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 15px; font-weight: 400; }
#modal input:focus { outline: none; border-color: var(--accent); }
#modal .btns { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
#modal .btn { height: 42px; padding: 0 20px; border-radius: 999px; font-weight: 700; background: var(--accent); color: var(--on-accent); }
#modal .btn.sec { background: transparent; color: var(--fg); border: 1px solid var(--line); }
#modal .btn.danger { background: var(--danger); color: var(--on-accent); }
#modal .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
#modal .kv dt { color: var(--muted); }
#modal .kv dd { margin: 0; }
#toast { position: fixed; z-index: 90; left: 50%; bottom: calc(var(--bar-h) + 24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 500; font-size: 14px; box-shadow: var(--shadow); transition: opacity .25s, translate .25s; }
#np:not([hidden]) ~ #toast { bottom: auto; top: calc(64px + env(safe-area-inset-top, 0px)); }
#toast.off { opacity: 0; translate: 0 10px; pointer-events: none; }
#drop { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(4px); }
#drop div { padding: 40px 48px; border: 2px dashed var(--accent); border-radius: 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
#drop img { width: 90px; }
#drop b { font: 900 24px var(--display); }

/* ---------- phones ---------- */
@media (max-width: 760px) {
  :root { --bar-h: 64px; }
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 0; padding: 0; }
  .side, #queuePanel { display: none !important; }
  main { border-radius: 0; background: var(--bg); }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 56px; }
  .topbar .circ.hist { display: none; }
  .topbar .ttl { margin-left: 0; }
  .topbar .lbl { display: none; }
  .topbar .pill.ghost { padding: 0 9px; }
  .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 24px; }
  .hero { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .hero .art { width: min(62vw, 240px); }
  .hero .meta { justify-content: center; }
  .hero h1 { font-size: clamp(28px, 9vw, 40px); letter-spacing: -.6px; }
  .actions { justify-content: space-between; }
  .actions .bigplay { order: 9; }
  .trow, .tracks.noalbum .trow { grid-template-columns: minmax(0, 1fr) 34px; padding: 6px 4px; gap: 8px; }
  .trow .n, .trow .al, .trow .d, .trow .lk, .trow.hd { display: none; }
  .trow .mo { opacity: 1; }
  .trow.now .ti .t::before { content: "♪ "; }
  .quick { grid-template-columns: 1fr 1fr; }
  .qt { grid-template-columns: 48px minmax(0, 1fr); height: 48px; font-size: 13px; padding-right: 8px; }
  .qt .thumb { width: 48px; height: 48px; }
  .qt .playfab { display: none; }
  .shelf { grid-auto-columns: minmax(132px, 40vw); }
  .grid-cards { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .playfab { display: none; }
  .bar { grid-column: 1; grid-row: 2; position: relative; margin: 0 8px 6px; margin-left: max(8px, env(safe-area-inset-left, 0px)); margin-right: max(8px, env(safe-area-inset-right, 0px)); padding: 8px 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--npc, #6b2445) 55%, var(--panel)); grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .bar.idle { display: none; }
  .np-mini { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; }
  .np-mini .thumb { width: 40px; height: 40px; }
  .ctrl .seek, .ctrl .btn-icon, .right .vol, .right #btnQueue, .right #btnMute, .right #btnExpand { display: none; }
  .ctrl { order: 2; }
  .ctrl .row { gap: 0; }
  .pp { background: none; color: var(--fg); width: 40px; height: 40px; }
  .pp .i { width: 28px; height: 28px; }
  .right { display: none; }
  .mini-progress { display: block; position: absolute; left: 10px; right: 10px; bottom: 2px; height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--fg) 20%, transparent); overflow: hidden; }
  .mini-progress i { display: block; height: 100%; width: 0; background: var(--fg); }
  .tabs { display: grid; grid-row: 3; grid-template-columns: repeat(3, 1fr); padding-block: 6px 4px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
  .tabs a { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 4px; }
  .tabs a.on { color: var(--fg); }
  .tabs a.on .i { color: var(--accent); }
  #toast { bottom: calc(var(--bar-h) + 70px + env(safe-area-inset-bottom, 0px)); }
  #ytDock { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; }
  #menu { left: 0 !important; right: 0; top: auto !important; bottom: 0; max-width: none; width: 100%; border-radius: 14px 14px 0 0; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); max-height: 80vh; }
  #menu button { padding: 13px 16px; font-size: 15px; }
  #scrim:not(.dark) { background: var(--scrim); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

<script>
(() => {
"use strict";

/* =========================================================== basics */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const I = (n, st = "") => `<svg class="i"${st ? ` style="${st}"` : ""} aria-hidden="true"><use href="#i-${n}"/></svg>`;
const LOGO = $(".brand img").src;
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (s) => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, "0"); return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const fmtLong = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h} hr ${m} min` : `${m} min`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const fmtBytes = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(0) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const keyOf = (s) => hashStr(String(s).toLowerCase()).toString(36);
function rng(seed) { let a = seed || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ls = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }, del(k) { try { localStorage.removeItem(k); } catch (_) {} } };
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const mobile = () => matchMedia("(max-width: 760px)").matches;

let toastT = 0;
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.remove("off"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("off"), ms); }

/* =========================================================== storage (IndexedDB, memory fallback) */
const DB = (() => {
  let db = null;
  const mem = { tracks: new Map(), audio: new Map(), covers: new Map(), meta: new Map() };
  function open() {
    return new Promise((res) => {
      try {
        const rq = indexedDB.open("sigeon-music", 1);
        rq.onupgradeneeded = () => { const d = rq.result; for (const s of ["tracks", "audio", "covers", "meta"]) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
        rq.onsuccess = () => { db = rq.result; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
        setTimeout(() => res(!!db), 4000);
      } catch (_) { res(false); }
    });
  }
  function run(store, mode, fn) {
    return new Promise((res, rej) => {
      let t; try { t = db.transaction(store, mode); } catch (e) { return rej(e); }
      let out; const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error("aborted"));
    });
  }
  return {
    open,
    get ok() { return !!db; },
    get: (s, k) => db ? run(s, "readonly", (o) => o.get(k)) : Promise.resolve(mem[s].get(k)),
    put: (s, k, v) => db ? run(s, "readwrite", (o) => o.put(v, k)) : (mem[s].set(k, v), Promise.resolve()),

let trendCache = null, trendErr = null, trendBusy = false;
function ytTrendHTML() {

let searchQ = "", ytResults = null, ytFor = "", ytErr = "", ytBusy = false;
function viewSearch(v) {
  v.innerHTML = `<form class="searchbox" id="searchForm" role="search">${I("search")}<input id="q" type="search" placeholder="What do you want to listen to?" autocomplete="off" value="${esc(searchQ)}" aria-label="Search"></form><div id="results" class="view" style="padding:0;gap:28px"></div>`;
  const q = $("#q"); q.addEventListener("input", () => { searchQ = q.value; renderResults(); });

function renderResults() {
  const box = $("#results"); if (!box) return;
  const q = searchQ.trim().toLowerCase();
  if (!q) {
    const genres = [...new Set(libTracks().map((t) => t.genre).filter(Boolean))].slice(0, 12);
    const hues = [330, 350, 10, 290, 310, 20, 270, 340];
    box.innerHTML = `<section class="sec"><h2 style="font-size:22px;font-weight:900">Browse your library</h2><div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${
      [["Liked Songs", "#liked"], ["Songs", "#library-songs"], ["Albums", "#library-albums"], ["Artists", "#library-artists"], ["Playlists", "#library-playlists"], ...genres.map((g) => [g, "#search", g])].map(([n, h, g], i) =>
        `<a href="${h}" ${g ? `data-act="genre" data-g="${esc(g)}"` : ""} style="aspect-ratio:16/10;max-width:100%;border-radius:10px;padding:14px;font:900 20px var(--display);color:#fff;background:linear-gradient(135deg,hsl(${hues[i % hues.length]} 62% 42%),hsl(${hues[(i + 3) % hues.length]} 55% 26%));overflow:hidden;overflow-wrap:anywhere">${esc(n)}</a>`).join("")}</div></section>`;

  const al = [...albums().values()].filter((a) => match(`${a.name} ${a.artist}`.toLowerCase()));
  const ar = [...artists().values()].filter((a) => match(a.name.toLowerCase()));

  let html = "";
  if (songs.length) html += `<section class="sec"><div class="sec-head"><h2>Songs in your library</h2></div>${trackRows(songs.map((t) => t.id), { label: `Search: ${searchQ}`, href: "#search", noHead: true })}</section>`;
  if (ar.length) html += `<section class="sec"><div class="sec-head"><h2>Artists</h2></div><div class="shelf">${ar.map((a) => card({ href: "#artist-" + a.key, art: `<img src="${artURL("artist|" + a.name)}" alt="">`, title: a.name, sub: "Artist", round: true })).join("")}</div></section>`;
  if (al.length) html += `<section class="sec"><div class="sec-head"><h2>Albums</h2></div><div class="shelf">${al.map((a) => card({ href: "#album-" + a.key, art: coverImg(S.tracks.get(a.ids[0])), title: a.name, sub: esc(a.artist), play: `data-act="play-album" data-id="${a.key}"` })).join("")}</div></section>`;
  if (pl.length) html += `<section class="sec"><div class="sec-head"><h2>Playlists</h2></div><div class="shelf">${pl.map((p) => card({ href: "#playlist-" + p.id, art: plCoverHTML(p.ids), title: p.name, sub: plural(p.ids.length, "song"), play: `data-act="play-pl" data-id="${p.id}"` })).join("")}</div></section>`;
  if (!html) html = `<p class="sub" style="margin:0">Nothing in your library matches “${esc(searchQ)}”.</p>`;
  html += `<section class="sec" id="ytSec"><div class="sec-head"><h2>On YouTube</h2></div><div id="ytBody">${ytSearchHTML()}</div></section>`;
  box.innerHTML = html; markNow();
}
function ytSearchHTML() {
  const q = searchQ.trim();
  if (YTA.mode === "none" || YTA.mode === "unknown") return `<div class="note">${I("video")}<p><b>YouTube search isn't connected.</b> It works by itself on the ConMon Lab site when the server has a YouTube key. Here, <button data-act="settings">add your own YouTube Data API key</button>.</p></div>`;
  if (ytBusy) return `<div class="loading"><span class="spin"></span>Searching YouTube for “${esc(ytFor)}”…</div>`;
  if (ytErr && ytFor === q) return `<div class="note">${I("video")}<p>${esc(ytErr)}</p></div>`;
  if (ytResults && ytFor === q) return ytResults.length ? trackRows(ytResults.map((t) => ensureTrack(t).id), { label: `YouTube: ${ytFor}`, href: "#search", album: false, noHead: true }) : `<p class="sub" style="margin:0">YouTube found nothing for “${esc(ytFor)}”.</p>`;

}
async function runYT() {

  ytBusy = true; ytFor = q; ytErr = ""; renderResults();
  try { ytResults = await YTA.search(q); } catch (e) { ytErr = e.message; ytResults = null; }
  ytBusy = false; const b = $("#ytBody"); if (b) { b.innerHTML = ytSearchHTML(); markNow(); }
}

    case "play-pl": { e.preventDefault(); e.stopPropagation(); ensureCtx(); const p = S.playlists.find((x) => x.id === d.id); if (p && p.ids.length) playIds(p.ids, p.name, "#playlist-" + p.id); else toast("This playlist is empty."); break; }
    case "play-liked": e.preventDefault(); ensureCtx(); if (S.liked.length) playIds(S.liked.slice(), "Liked Songs", "#liked"); else toast("You haven't liked any songs yet."); break;
    case "more": e.stopPropagation(); trackMenu(el, d.id, d.pl, +d.pi); break;
    case "more-current": if (cur()) trackMenu(el, cur().id); break;
    case "m-pl-pick": playlistPicker(d.id); break;
    case "m-pl-add": { const p = S.playlists.find((x) => x.id === d.pl); const t = S.tracks.get(d.id); if (p && t) { if (p.ids.includes(d.id)) toast(`Already in ${p.name}`); else { p.ids.push(d.id); keepTrack(t); saveMeta("playlists"); toast(`Added to ${p.name}`); refreshAll(); } } closeMenu(); break; }
    case "m-pl-new": closeMenu(); newPlaylistModal(d.id); break;
    case "m-pl-remove": { const p = S.playlists.find((x) => x.id === d.pl); if (p) { p.ids.splice(+d.pi, 1); saveMeta("playlists"); refreshAll(); toast(`Removed from ${p.name}`); } closeMenu(); break; }
    case "m-like": closeMenu(); toggleLike(d.id); break;
    case "m-next": closeMenu(); playNext(d.id); break;
    case "m-queue": closeMenu(); addToQueue(d.id); break;
    case "m-go": closeMenu(); closeNP(); location.hash = d.href; break;
    case "m-yt": { closeMenu(); const u = "https://www.youtube.com/watch?v=" + d.id; if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => toast("Link copied"), () => toast(u, 6000)); else toast(u, 6000); break; }
    case "m-edit": closeMenu(); editTrackModal(S.tracks.get(d.id)); break;
    case "m-delete": { closeMenu(); const t = S.tracks.get(d.id); if (!t) break; if (t.source === "youtube") deleteTrack(d.id); else confirmModal("Delete this song?", `"${t.title}" will be removed from this browser, from Liked Songs and from every playlist. The original file on your device isn't touched.`, "Delete", () => deleteTrack(d.id)); break; }
    case "pl-menu": { const p = S.playlists.find((x) => x.id === d.id); if (!p) break; openMenu(el, `<button data-act="pl-edit" data-id="${p.id}">${I("edit")}Edit details</button><button data-act="pl-queue" data-id="${p.id}">${I("queue")}Add to queue</button><hr><button class="danger" data-act="pl-delete" data-id="${p.id}">${I("trash")}Delete playlist</button>`); break; }
    case "pl-edit": closeMenu(); editPlaylistModal(S.playlists.find((x) => x.id === d.id)); break;
    case "pl-queue": { closeMenu(); const p = S.playlists.find((x) => x.id === d.id); if (p) p.ids.forEach((id) => addToQueue(id)); break; }
    case "pl-delete": { closeMenu(); const p = S.playlists.find((x) => x.id === d.id); if (p) confirmModal("Delete playlist?", `"${p.name}" will be deleted. Its songs stay in your library.`, "Delete", () => { S.playlists = S.playlists.filter((x) => x !== p); saveMeta("playlists"); location.hash = "#library"; toast("Playlist deleted"); }); break; }
    case "pl-add": { const p = S.playlists.find((x) => x.id === d.pl); if (p && !p.ids.includes(d.id)) { p.ids.push(d.id); saveMeta("playlists"); refreshAll(); toast(`Added to ${p.name}`); } break; }
    case "new-playlist": newPlaylistModal(); break;
    case "import": $("#filePick").click(); break;
    case "settings": settingsModal(); break;
    case "modal-close": closeModal(); break;
    case "yt-search": runYT(); break;
    case "genre": e.preventDefault(); searchQ = d.g; if (currentRoute === "search") { $("#q").value = searchQ; renderResults(); } else location.hash = "#search"; break;
    case "toggle-queue": { if (mobile()) { openNP(); toggleNPQueue(true); break; } const q = $("#queuePanel"); q.hidden = !q.hidden; $("#btnQueue").classList.toggle("on", !q.hidden); renderQueue(); break; }
    case "q-jump": if (e.target.closest("[data-act=q-remove]")) break; ensureCtx(); S.qpos = +d.i; loadCurrent(true); break;
    case "q-remove": { e.stopPropagation(); const i = +d.i; if (i === S.qpos) break; S.queue.splice(i, 1); if (i < S.qpos) S.qpos--; if (i <= S.manualEnd) S.manualEnd--; saveMeta("session"); renderQueue(); break; }
    case "open-np": if (!mobile() || el.id === "barArt" || el.id === "btnExpand") openNP(); break;
    case "open-np-mobile": if (mobile()) { e.preventDefault(); openNP(); } break;
    case "close-np": closeNP(); break;
    case "np-queue": toggleNPQueue(); break;
    case "yt-close": P.pause(); hideDock(); toast("Video stopped"); break;
  }
});
function toggleNPQueue(force) {
  const q = $("#npQueue"), m = $("#npMain"); const show = force !== undefined ? force : q.hidden;
  q.hidden = !show; m.hidden = show; if (show) $("#npQueueBody").innerHTML = queueHTML(); placeDock();
}
// mobile: tapping anywhere on the mini bar (except controls) opens the player
$("#bar").addEventListener("click", (e) => { if (mobile() && !e.target.closest("button,a,input")) openNP(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (!$("#modal").hidden) closeModal(); else if (!$("#menu").hidden) closeMenu(); else if (!$("#np").hidden) closeNP(); return; }
  const row = e.target.closest && e.target.closest(".trow[data-list]");
  if (row && e.key === "Enter") { row.click(); return; }
  if (e.target.matches("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " && !e.target.matches("button,a")) { e.preventDefault(); ensureCtx(); P.toggle(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); e.shiftKey ? next(false) : P.seek(Math.min(P.time + 5, P.duration)); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); e.shiftKey ? prev() : P.seek(Math.max(0, P.time - 5)); }
  else if (e.key.toLowerCase() === "l" && cur()) toggleLike(cur().id);
  else if (e.key.toLowerCase() === "m") { S.settings.muted = !S.settings.muted; applyVolume(); }
  else if (e.key === "/") { e.preventDefault(); location.hash = "#search"; }
});
$("#filePick").addEventListener("change", (e) => { if (e.target.files.length) importFiles(e.target.files); e.target.value = ""; });
let dragN = 0;
addEventListener("dragenter", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { dragN++; $("#drop").hidden = false; } });
addEventListener("dragleave", () => { dragN = Math.max(0, dragN - 1); if (!dragN) $("#drop").hidden = true; });
addEventListener("dragover", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) e.preventDefault(); });
addEventListener("drop", (e) => { e.preventDefault(); dragN = 0; $("#drop").hidden = true; if (e.dataTransfer?.files?.length) importFiles(e.dataTransfer.files); });
$("#main").addEventListener("scroll", () => { $("#topbar").classList.toggle("solid", $("#main").scrollTop > 60); }, { passive: true });
$("#btnBack").addEventListener("click", () => history.back());
$("#btnFwd").addEventListener("click", () => history.forward());
addEventListener("hashchange", () => { closeMenu(); route(); });

/* =========================================================== boot */
async function boot() {
  try { await logoImg.decode(); } catch (_) {}
  route();
  await DB.open();
  const [tr, meta] = await Promise.all([DB.all("tracks").catch(() => []), DB.all("meta").catch(() => [])]);
  for (const [k, t] of tr) S.tracks.set(k, t);
  const M = Object.fromEntries(meta);
  if (Array.isArray(M.playlists)) S.playlists = M.playlists;
  if (Array.isArray(M.liked)) S.liked = M.liked;
  if (Array.isArray(M.recent)) S.recent = M.recent;
  if (M.settings) Object.assign(S.settings, M.settings);
  applyVolume(); modesUI();
  if (M.session && Array.isArray(M.session.queue)) {
    const q = M.session.queue.filter((id) => S.tracks.has(id));
    if (q.length) { S.queue = q; S.qpos = Math.max(0, Math.min(q.indexOf(M.session.queue[M.session.qpos]), q.length - 1)); S.manualEnd = S.qpos; S.ctx = M.session.ctx || S.ctx; nowUI(); resumeAt = M.session.time || 0; }
  }
  refreshAll(); updateStorage();
  YTA.detect().then(() => { refreshAll(); });
  const seeded = await seedDemos();
  if (seeded) { refreshAll(); updateStorage(); }
}
let resumeAt = 0;
// first play after a reload continues where the last session stopped
const origPlay = P.play.bind(P);
P.play = function () { if (!this.engine && cur() && resumeAt) { const at = resumeAt; resumeAt = 0; ensureCtx(); const t = cur(); if (t.source !== "youtube") { S.recent = [t.id, ...S.recent.filter((x) => x !== t.id)].slice(0, 60); saveMeta("recent"); } return this.load(t, true, at); } return origPlay(); };
boot();
if ("serviceWorker" in navigator && location.protocol === "https:" && /\/music\/?$/.test(location.pathname)) navigator.serviceWorker.register("sw.js").catch(() => {});
window.claude?.hot?.snapshot?.(() => ({}));
})();
</script>
